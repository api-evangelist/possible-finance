name: Possible Finance
description: >-
  Possible Finance is a consumer fintech company offering small-dollar
  installment loans and credit-building products through a mobile app. Its core
  products are the Possible Loan (up to $500 with flexible repayment schedules),
  the Possible Advance (up to $300 drawn against a future paycheck), and Bill &
  Rent Reporting that builds credit history by reporting on-time payments to the
  credit bureaus. The company charges no late fees or penalty charges and uses
  AI-driven underwriting based on real banking activity rather than FICO scores,
  serving borrowers who are underserved by traditional credit. Possible Finance
  operates as a Delaware Public Benefit Corporation and is backed by Union Square
  Ventures. It is a mobile-app, consumer-facing product with no public developer
  API surface; this profile captures its identity and domain-security posture for
  the API Evangelist network.
